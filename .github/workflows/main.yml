name: Build debug APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -q offlinehub.zip -d app_src
          APP_DIR=$(dirname "$(find app_src -name package.json -not -path '*/node_modules/*' | head -1)")
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $APP_DIR"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Run tests
        working-directory: ${{ env.APP_DIR }}
        run: npm test

      - name: Type-check and build web app
        working-directory: ${{ env.APP_DIR }}
        run: npm run build

      - name: Create Android project and sync
        working-directory: ${{ env.APP_DIR }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineHub-debug-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
